<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#17231c;
    color:#ede6d6;
    font-family:Arial, Helvetica, sans-serif;
    text-align:center;
}

a{
    color:#c6a15b;
    text-decoration:none;
    font-weight:bold;
}

.links{
    display:flex;
    gap:20px;
    justify-content:center;
    margin-top:20px;
    flex-wrap:wrap;
}
</style>

<script>
(function () {

    // Langues disponibles
    const supported = ["fr","de","it","en"];

    // 1. Vérifie si l'utilisateur a déjà choisi une langue
    const savedLang = localStorage.getItem("language");

    if(savedLang && supported.includes(savedLang)){
        window.location.replace("/" + savedLang + "/");
        return;
    }

    // 2. Sinon regarde les préférences du navigateur
    const browserLanguages = navigator.languages || [navigator.language || "en"];

    let target = "en";

    for(const lang of browserLanguages){

        const code = lang.substring(0,2).toLowerCase();

        if(supported.includes(code)){
            target = code;
            break;
        }
    }

    window.location.replace("/" + target + "/");

})();
</script>

</head>

<body>
